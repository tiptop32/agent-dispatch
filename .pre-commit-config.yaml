repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: detect-secrets
        name: detect-secrets
        # api_key_env это имя переменной окружения, не значение
        entry: uv run detect-secrets-hook --baseline .secrets.baseline --exclude-lines 'api_key_env'
        language: system
        exclude: ^(uv\.lock)$
      - id: pytest-gate
        name: pytest gate
        entry: uv run pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
