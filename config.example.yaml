server:
  host: 127.0.0.1
  port: 7433
  max_concurrent_tasks: 4     # общий потолок правок; с max_concurrent_reviews: 5 корневых процессов при дефолтах
  max_concurrent_per_group: 2 # отдельный пул на limit_group; группа берётся раньше общего слота
  max_concurrent_reviews: 1   # корневые ревью в собственной ёмкости: долгие задачи их не блокируют, лишние ревью ждут
  data_dir: ~/.local/share/agent-dispatch

mcp:
  wait_seconds: 50

router:
  backend: jev
  jev:
    base_url: https://openrouter.ai/api/alpha/decisions
    model: typesafe/jev-1.13
    api_key_env: OPENROUTER_API_KEY
    retries: 2
    timeout_seconds: 15
  claude_local:
    command: claude
    model: null

routing:
  min_confidence: 0.60        # ниже: решение не несёт информации, идёт fallback_executor
  autonomous_confidence: 0.85  # выше: решению можно доверять без присмотра
  min_margin: 0.10
  explore_share: 0.0          # доля пригодных решений Jev для статического balanced-исполнителя
  preferred_executor_max_wait_seconds: 60  # 0 выключает резерв по очереди; только тот же тир
  fallback_executor: omp/sol  # или список [a, b]: первый доступный, остальные в резерве
  max_hops: 2
  max_children: 2
  corporate_min_confidence: 0.0  # порог уверенности ответа о корп. данных; 0 = доверять любому
  corporate_perimeter: true     # false: вопрос о корп. данных не задаётся и пул не сужается
  exclude_source_agent: true
  default_timeout_seconds: 1800
  availability_ttl_seconds: 60
  # лимит расходов, перегруженная модель, отказ авторизации, обрыв сети:
  # исполнитель выходит из ротации на столько секунд; 0 выключает
  failure_cooldown_seconds: 900
  # исчерпанный лимит держит исполнителя до сброса из сообщения CLI
  # («resets 5am», «Try again at 5:02 PM»); если сброс не назван, столько секунд.
  # Вместе с ним остывают все, у кого тот же limit_group (claude/*;
  # у omp — провайдер из model: omp:agent-lb, omp:copilot-x5).
  quota_cooldown_seconds: 3600
  # источник -> адаптеры, которым он отдаёт только ревью (kind: review), не задачи.
  # codex остаётся валидным источником для старых задач в БД.
  review_only:
    omp: [claude]
  # потолок расходов цепочки эскалации с подзадачами, $; null выключает.
  # Считается только цена, которую сообщает CLI (claude, omp).
  max_chain_cost_usd: null
  # потолок расходов за локальные сутки (исполнители и роутер), $; null выключает.
  # Дошли до него: новые задачи и звенья эскалации получают отказ budget.
  daily_cost_limit_usd: null

execution:
  workspace_mode: in_place    # worktree: каждому исполнителю свой git worktree
  worktree_dir: null          # по умолчанию <data_dir>/worktrees
  branch_prefix: agent-dispatch
  integrate: apply            # apply: патч в рабочую копию; branch: только ветка; manual: ничего не трогать
  keep_worktrees: false
  idle_timeout_seconds: 900
  verify_timeout_seconds: 600 # предел на каждую команду verify из запроса
  report_recovery_timeout_seconds: 300 # дозапрос отчёта в той же сессии, если работа есть, а блока нет; 0 выключает

executors:
  claude:
    adapter: claude
    command: claude
    extra_args: ["--permission-mode", "acceptEdits", "--allowedTools", "Bash,Edit,Write,Read,Glob,Grep"]
    enabled: true
    tier: strong
    description: "Claude Code: strongest reasoning, multi-file refactors, ambiguous or design-heavy tasks; most expensive"
  omp/sol:
    adapter: omp
    command: omp
    model: agent-lb/gpt-6.1-sol
    extra_args: []
    enabled: true
    tier: balanced
    limit_group: agent-lb
    limit_reset: recheck  # пул аккаунтов за балансером: названный сброс относится к одному аккаунту
    description: "omp с GPT-6.1 Sol через agent-lb: autonomous bug fixing and test-driven fixes; medium cost"
  omp/terra:
    adapter: omp
    command: omp
    model: agent-lb/gpt-6.1-terra
    extra_args: []
    enabled: true
    tier: balanced
    limit_group: agent-lb
    limit_reset: recheck
    description: "omp с GPT-6.1 Terra через agent-lb: второй balanced-исполнитель той же группы лимита"
  omp/luna:
    adapter: omp
    command: omp
    model: agent-lb/gpt-5.6-luna
    extra_args: []
    enabled: true
    tier: fast
    limit_group: agent-lb
    limit_reset: recheck
    description: "omp с GPT-5.6 Luna через agent-lb: cheap, good for small well-specified edits, docs, boilerplate"
  omp/x5-code-large:
    adapter: omp
    command: omp
    model: copilot-x5/x5-airun-code-large
    extra_args: []
    enabled: true
    tier: balanced
    corporate: true  # copilot-x5: корпоративный периметр данных
    description: "omp с X5 Airun Code Large через copilot-x5: корпоративные данные не уходят за периметр"
    # review_by: omp/sol  # ревью законченной правки до интеграции, fail эскалирует
  omp/x5-small-coder:
    adapter: omp
    command: omp
    model: copilot-x5/x5-airun-small-coder
    extra_args: []
    enabled: false
    tier: fast
    corporate: true
    description: "omp с X5 Airun Small Coder через copilot-x5: быстрые мелкие правки внутри периметра"
  omp/copilot-code-flash:
    adapter: omp
    command: omp
    model: copilot-x5/copilot-code-flash
    extra_args: []
    enabled: false
    tier: fast
    corporate: true
    description: "omp с Copilot Code Flash через copilot-x5: быстрый корпоративный исполнитель"
  omp/copilot-code-flash-thinking:
    adapter: omp
    command: omp
    model: copilot-x5/copilot-code-flash
    extra_args: ["--thinking", "high"]
    enabled: false
    tier: balanced
    corporate: true
    description: "omp с Copilot Code Flash в режиме рассуждений через copilot-x5: balanced внутри периметра"

escalation:
  omp/luna: [omp/terra, omp/sol, claude]
  omp/terra: [omp/sol, claude]
  omp/sol: [claude]
  omp/x5-code-large: [omp/x5-small-coder]
