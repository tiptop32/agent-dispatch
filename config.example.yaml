server:
  host: 127.0.0.1
  port: 7433
  max_concurrent_tasks: 2
  data_dir: ~/.local/share/agent-dispatch

mcp:
  wait_seconds: 50

router:
  backend: jev
  jev:
    base_url: https://openrouter.ai/api/alpha/decisions
    model: typesafe/jev-1.13
    api_key_env: OPENROUTER_API_KEY
    retries: 2
    timeout_seconds: 15
  claude_local:
    command: claude
    model: null

routing:
  min_confidence: 0.60        # ниже: решение не несёт информации, идёт fallback_executor
  autonomous_confidence: 0.85  # выше: решению можно доверять без присмотра
  min_margin: 0.10
  fallback_executor: codex
  max_hops: 2
  max_children: 2
  corporate_min_confidence: 0.0  # порог уверенности ответа о корп. данных; 0 = доверять любому
  corporate_perimeter: true     # false: вопрос о корп. данных не задаётся и пул не сужается
  exclude_source_agent: true
  default_timeout_seconds: 1800
  availability_ttl_seconds: 60

execution:
  workspace_mode: in_place    # worktree: каждому исполнителю свой git worktree
  worktree_dir: null          # по умолчанию <data_dir>/worktrees
  branch_prefix: agent-dispatch
  integrate: apply            # apply: патч в рабочую копию; branch: только ветка; manual: ничего не трогать
  keep_worktrees: false
  idle_timeout_seconds: 900

executors:
  claude:
    adapter: claude
    command: claude
    extra_args: ["--permission-mode", "acceptEdits", "--allowedTools", "Bash,Edit,Write,Read,Glob,Grep"]
    enabled: true
    tier: strong
    description: "Claude Code: strongest reasoning, multi-file refactors, ambiguous or design-heavy tasks; most expensive"
  codex:
    adapter: codex
    command: codex
    extra_args: ["--sandbox", "workspace-write"]
    enabled: true
    tier: balanced
    description: "OpenAI Codex CLI: autonomous bug fixing and test-driven fixes in a single repo; medium cost"
  opencode/kimi:
    adapter: opencode
    command: opencode
    model: openrouter/kimi-k2.5
    extra_args: []
    enabled: true
    tier: fast
    description: "OpenCode with Kimi K2.5: cheap, good for small well-specified edits, docs, boilerplate"

escalation:
  opencode/kimi: [codex, claude]
  codex: [claude]
